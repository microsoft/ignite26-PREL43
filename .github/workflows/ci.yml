name: ci
on:
  push: {branches: [main]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build and test
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -Scope CurrentUser -SkipPublisherCheck
          ./build/Build.ps1 -CloudCredential CI
          $r = Invoke-Pester ./tests -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { exit 1 }
