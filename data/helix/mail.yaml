# Seat mailbox content. Written into each seat's Inbox at hydration.
#
# Times are offsets from the lab day (D0) in the seat's time zone: "D-9 09:12".
# Nothing may be later than D-1 09:00, because hydration runs from D-1 09:30.
# People are persona keys from people.yaml; `learner` is the seat.
# Body text supports {{learner}}, {{learner_first}}, {{date:D+2}}, {{weekday:D+2}}.
# A blank line separates paragraphs.
#
# Seeded facts: F1 supplier, F2 open decisions, F6 executive question,
# W1/W2 people waiting. See readiness/check-set for the expected answers.

messages:

  # ---------------------------------------------------------------- supplier thread (exactly 6, one conversation)
  - id: s-1
    conversation: supplier
    from: felix
    to: [nadia]
    cc: [learner, chloe, ethan]
    subject: "Helix sensor modules: capacity risk"
    sent: "D-9 09:12"
    read: true
    fact: F1
    body: |
      Hi Nadia,

      A heads-up on the Helix sensor modules. One of our two fab lines for the module is down for unplanned maintenance, and I can't yet promise the full 12,000 modules on the original delivery date.

      I'll come back with firm volumes as soon as the line is assessed.

      Regards,
      Felix Grant
      Account Manager, Corvane Components

  - id: s-2
    conversation: supplier
    from: nadia
    to: [felix]
    cc: [learner, chloe, ethan]
    subject: "RE: Helix sensor modules: capacity risk"
    sent: "D-8 11:03"
    read: true
    fact: F1
    body: |
      Hi Felix,

      Thanks for the early warning. What volume can you commit to on the original date, and when would the rest follow? We need numbers to plan around, not a range.

      Nadia

  - id: s-3
    conversation: supplier
    from: felix
    to: [nadia]
    cc: [learner, chloe, ethan]
    subject: "RE: Helix sensor modules: capacity risk"
    sent: "D-7 16:40"
    read: true
    fact: F1
    body: |
      Nadia,

      Firm numbers: we can ship 60% of the Helix sensor modules on schedule. The remaining 40% will be eight days late.

      Let me know how you want to handle the split.

      Felix

  - id: s-4
    conversation: supplier
    from: ethan
    to: [nadia, felix]
    cc: [learner, chloe]
    subject: "RE: Helix sensor modules: capacity risk"
    sent: "D-5 14:05"
    read: true
    body: |
      Nadia, Felix,

      I've moved over to the Gen2 refresh programme, so {{learner}} is taking over the Helix launch. Please keep {{learner_first}} on this thread from here on.

      Ethan

  - id: s-5
    conversation: supplier
    from: nadia
    to: [learner]
    cc: [chloe, omar]
    subject: "RE: Helix sensor modules: capacity risk"
    sent: "D-3 10:20"
    read: false
    fact: F2
    body: |
      Hi {{learner_first}},

      We need a call on this. Either we accept the split shipment (60% on time, 40% eight days late) or we fill the gap with the Gen2 sensor as a fallback. Procurement can execute either, but it isn't my decision to make.

      Can you tell me which way we're going?

      Nadia

  - id: s-6
    conversation: supplier
    from: felix
    to: [nadia, learner]
    subject: "RE: Helix sensor modules: capacity risk"
    sent: "D-1 07:40"
    read: false
    importance: high
    fact: F1
    body: |
      Hi both,

      We can ship 60% of the Helix sensor modules on the original date and the remaining 40% eight days later.

      Please confirm by end of day on {{date:D+2}} whether to split the shipment or hold the full order. If we don't hear back, we hold the full order.

      Felix

