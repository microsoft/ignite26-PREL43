# Per-seat team and the Launch - Helix channel.
# Imported in migration mode so posts keep their original times and authors.
# Times are offsets from D0; all must be earlier than D-1 09:00.
# `mentions: [learner]` renders an @mention of the seat at {{mention:learner}}.

