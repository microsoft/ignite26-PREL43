<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>Hydration Kit flow: from repository to score</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A94A8"/>
    </marker>
  </defs>
  <rect width="1280" height="440" fill="#FFFFFF"/>

  <!-- lanes -->
  <rect x="24" y="24" width="248" height="392" rx="14" fill="#F4F6FB"/>
  <rect x="296" y="24" width="960" height="392" rx="14" fill="#F2F8FF"/>
  <text x="44" y="56" font-size="13" font-weight="700" fill="#5C6B8A" letter-spacing="1">VECTORSENSE</text>
  <text x="316" y="56" font-size="13" font-weight="700" fill="#5C6B8A" letter-spacing="1">SKILLABLE TENANT AND LAB</text>

  <!-- 1 repository -->
  <rect x="44" y="76" width="208" height="320" rx="12" fill="#FFFFFF" stroke="#D5DBE7"/>
  <rect x="44" y="76" width="208" height="6" rx="3" fill="#06185B"/>
  <text x="62" y="112" font-size="18" font-weight="700" fill="#06185B">Hydration Kit</text>
  <text x="62" y="134" font-size="13" fill="#5C6B8A">private GitHub repo, v1.0.0</text>
  <g font-size="14" fill="#22336E">
    <text x="62" y="176">Data pack</text>
    <text x="62" y="204">vs-hydrate engine</text>
    <text x="62" y="232">Readiness check set</text>
    <text x="62" y="260">Scorecard (12 checks)</text>
    <text x="62" y="288">Lab guide and notes</text>
  </g>
  <text x="62" y="372" font-size="12" fill="#5C6B8A">In Skillable's GitHub org.</text>

  <line x1="252" y1="236" x2="314" y2="236" stroke="#8A94A8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 2 operator commands -->
  <rect x="316" y="76" width="280" height="320" rx="12" fill="#FFFFFF" stroke="#D5DBE7"/>
  <rect x="316" y="76" width="280" height="6" rx="3" fill="#007FFF"/>
  <text x="334" y="112" font-size="18" font-weight="700" fill="#06185B">Operator runs vs-hydrate</text>
  <text x="334" y="134" font-size="13" fill="#5C6B8A">clone, pip install, run</text>
  <g font-size="14" fill="#22336E">
    <text x="334" y="176"><tspan font-weight="700">validate</tspan>  permissions, licences</text>
    <text x="334" y="208"><tspan font-weight="700">tenant</tspan>  32 personas, once</text>
    <text x="334" y="240"><tspan font-weight="700">seats --count N</tspan>  from D-1</text>
    <text x="334" y="272"><tspan font-weight="700">check</tspan>  readiness per seat</text>
  </g>
  <text x="334" y="372" font-size="12" fill="#5C6B8A">Idempotent; re-run resumes.</text>

  <line x1="596" y1="236" x2="634" y2="236" stroke="#8A94A8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 3 seat -->
  <rect x="636" y="76" width="200" height="320" rx="12" fill="#FFFFFF" stroke="#D5DBE7"/>
  <rect x="636" y="76" width="200" height="6" rx="3" fill="#0F8B8D"/>
  <text x="654" y="112" font-size="18" font-weight="700" fill="#06185B">Ready seat</text>
  <text x="654" y="134" font-size="13" fill="#5C6B8A">one per learner</text>
  <g font-size="14" fill="#22336E">
    <text x="654" y="176">Helix mail (35)</text>
    <text x="654" y="204">Launch - Helix (20)</text>
    <text x="654" y="232">8 channel files</text>
    <text x="654" y="260">4 meetings ahead</text>
    <text x="654" y="288">Licences + TAP</text>
  </g>
  <text x="654" y="372" font-size="12" fill="#5C6B8A">seat-inventory.json</text>

  <line x1="836" y1="236" x2="874" y2="236" stroke="#8A94A8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 4 learner -->
  <rect x="876" y="76" width="176" height="320" rx="12" fill="#FFFFFF" stroke="#D5DBE7"/>
  <rect x="876" y="76" width="176" height="6" rx="3" fill="#8B3BAB"/>
  <text x="894" y="112" font-size="18" font-weight="700" fill="#06185B">Learner</text>
  <text x="894" y="134" font-size="13" fill="#5C6B8A">lab VM, Edge, Cowork</text>
  <g font-size="14" fill="#22336E">
    <text x="894" y="176">M1 Delegation</text>
    <text x="894" y="204">M2 Readiness pack</text>
    <text x="894" y="232">M3 Skill</text>
    <text x="894" y="260">M4 Daily briefing</text>
    <text x="894" y="288">M5 Toolkit (optional)</text>
  </g>
  <text x="894" y="372" font-size="12" fill="#5C6B8A">3 hours, individual</text>

  <line x1="1052" y1="236" x2="1090" y2="236" stroke="#8A94A8" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 5 score -->
  <rect x="1092" y="76" width="144" height="320" rx="12" fill="#FFFFFF" stroke="#D5DBE7"/>
  <rect x="1092" y="76" width="144" height="6" rx="3" fill="#E8710A"/>
  <text x="1110" y="112" font-size="18" font-weight="700" fill="#06185B">Submit</text>
  <text x="1110" y="134" font-size="13" fill="#5C6B8A">score --seat</text>
  <text x="1110" y="200" font-size="40" font-weight="700" fill="#06185B">100</text>
  <text x="1110" y="224" font-size="13" fill="#5C6B8A">points, 12 checks</text>
  <text x="1110" y="276" font-size="40" font-weight="700" fill="#E8710A">70</text>
  <text x="1110" y="300" font-size="13" fill="#5C6B8A">pass mark</text>
  <text x="1110" y="372" font-size="12" fill="#5C6B8A">then retire</text>
</svg>
