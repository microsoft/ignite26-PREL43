{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vs.fullname" . }}-migrate
  labels: {{- include "vs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/component: migrate
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "vs.fullname" . }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "vs.image" (list . .Values.image.backend) }}
          args: ["python", "-m", "app.migrate"]
          {{- include "vs.backendEnv" . | nindent 10 }}
          {{- include "vs.kvMount" . | nindent 10 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
      {{- include "vs.kvVolume" . | nindent 6 }}
{{- end }}
