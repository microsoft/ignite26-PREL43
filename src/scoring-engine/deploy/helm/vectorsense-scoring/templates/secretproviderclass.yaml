{{- if and .Values.keyVault.enabled (not .Values.existingSecret) }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "vs.fullname" . }}-kv
  labels: {{- include "vs.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.workloadIdentity.clientId | quote }}
    keyvaultName: {{ required "keyVault.name is required" .Values.keyVault.name | quote }}
    tenantId: {{ .Values.workloadIdentity.tenantId | quote }}
    objects: |
      array:
      {{- range $env, $secret := .Values.keyVault.objects }}
        - |
          objectName: {{ $secret }}
          objectType: secret
      {{- end }}
  secretObjects:
    - secretName: {{ include "vs.secretName" . }}
      type: Opaque
      data:
      {{- range $env, $secret := .Values.keyVault.objects }}
        - objectName: {{ $secret }}
          key: {{ $env }}
      {{- end }}
{{- end }}
