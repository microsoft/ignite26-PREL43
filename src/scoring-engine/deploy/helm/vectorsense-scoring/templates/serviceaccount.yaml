apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vs.fullname" . }}
  labels: {{- include "vs.labels" . | nindent 4 }}
  annotations:
    azure.workload.identity/client-id: {{ required "workloadIdentity.clientId is required" .Values.workloadIdentity.clientId | quote }}
    azure.workload.identity/tenant-id: {{ .Values.workloadIdentity.tenantId | quote }}
