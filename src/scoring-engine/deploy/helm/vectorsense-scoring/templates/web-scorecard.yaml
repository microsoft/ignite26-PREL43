apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vs.fullname" . }}-web-scorecard
  labels: {{- include "vs.labels" . | nindent 4 }}
    app.kubernetes.io/component: web-scorecard
spec:
  replicas: {{ .Values.webScorecard.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web-scorecard}
  template:
    metadata:
      labels: {{- include "vs.labels" . | nindent 8 }}
        app.kubernetes.io/component: web-scorecard
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: web
          image: {{ include "vs.image" (list . .Values.image.scorecard) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_UPSTREAM
              value: http://{{ include "vs.fullname" . }}-api:8000
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: http}, periodSeconds: 10}
          resources: {{- toYaml .Values.webScorecard.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vs.fullname" . }}-web-scorecard
  labels: {{- include "vs.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web-scorecard}
  ports: [{name: http, port: 8080, targetPort: http}]
