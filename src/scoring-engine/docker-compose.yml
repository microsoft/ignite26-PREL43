# Local stack: Postgres + API + worker + portal, with mock Microsoft Graph evidence.
#   docker compose up --build            -> admin portal http://localhost:8080, participant scorecard http://localhost:8081
#   docker compose --profile demo up     -> also runs the lab-partner simulator (live activity)
name: vectorsense-scoring

x-backend-env: &backend-env
  VS_ENVIRONMENT: local
  VS_DATABASE_URL: postgresql+asyncpg://scoring:scoring@db:5432/scoring
  VS_PUBLIC_BASE_URL: http://localhost:8080
  VS_SCORECARD_BASE_URL: http://localhost:8081
  VS_JWT_SIGNING_KEY: local-dev-signing-key-change-me-0123456789
  VS_SECRET_PEPPER: local-dev-pepper
  VS_AUTH_MODE: local
  VS_ADMIN_USERNAME: admin
  VS_ADMIN_PASSWORD: ${VS_ADMIN_PASSWORD:-VectorSense!2026}
  VS_GRAPH_MODE: mock
  VS_GRAPH_MOCK_FILE: /app/samples/local/mock_graph.json
  VS_DEFERRED_RECHECK_INTERVAL_SECONDS: "20"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scoring
      POSTGRES_PASSWORD: scoring
      POSTGRES_DB: scoring
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scoring"]
      interval: 3s
      retries: 20

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["sh", "-c", "python -m app.migrate && python -m app.seed_demo --credentials-out /app/samples/local/demo_credentials.json"]
    volumes: [evidence:/app/samples/local]
    depends_on:
      db: {condition: service_healthy}

  api:
    build: ./backend
    environment: *backend-env
    volumes: [evidence:/app/samples/local]
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      retries: 20

  worker:
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    volumes: [evidence:/app/samples/local]
    depends_on:
      migrate: {condition: service_completed_successfully}

  web-admin:
    build: {context: ./frontend, args: {APP: web-admin}}
    environment:
      API_UPSTREAM: http://api:8000
    ports: ["8080:8080"]
    depends_on:
      api: {condition: service_started, restart: true}  # nginx resolves the API address at start

  web-scorecard:
    build: {context: ./frontend, args: {APP: web-scorecard}}
    environment:
      API_UPSTREAM: http://api:8000
    ports: ["8081:8080"]
    depends_on:
      api: {condition: service_started, restart: true}

  simulator:
    profiles: [demo]
    build: ./backend
    command: ["python", "scripts/vendor_simulator.py", "--api", "http://api:8000",
              "--credentials", "/app/samples/local/demo_credentials.json",
              "--mock-file", "/app/samples/local/mock_graph.json", "--participants", "40", "--speed", "2"]
    volumes: [evidence:/app/samples/local]
    depends_on:
      api: {condition: service_healthy}

  # Same simulator, but the lab partner never calls the API: work only lands in Microsoft 365 and
  # the organiser scores it with "Sync now" on the event leaderboard.
  simulator-no-api:
    profiles: [demo-sync]
    build: ./backend
    command: ["python", "scripts/vendor_simulator.py", "--no-api",
              "--credentials", "/app/samples/local/demo_credentials.json",
              "--mock-file", "/app/samples/local/mock_graph.json", "--participants", "20", "--first-account", "101", "--speed", "3", "--seed", "11"]
    volumes: [evidence:/app/samples/local]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  evidence:
